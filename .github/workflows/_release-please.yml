name: _release-please

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: PAT used so the release PR triggers CI (a GITHUB_TOKEN-created PR would not).
        required: true
    outputs:
      release_created:
        description: Whether release-please cut a release on this run
        value: ${{ jobs.release-please.outputs.release_created }}

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Release please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json
