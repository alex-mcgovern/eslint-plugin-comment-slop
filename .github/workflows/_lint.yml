name: _lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prettier
        run: pnpm run prettier

      - name: ESLint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run tsc
